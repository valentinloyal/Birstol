<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Bristol — fiches de révision</title>
<meta name="description" content="Fiches de révision : importez un dossier de questions-réponses, ajoutez les vôtres, révisez." />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#2A0F4C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bristol" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; padding:0; height:100%; background:#2A0F4C; overscroll-behavior:none; }
  #root { height:100%; }
</style>
<script>
  window.__bip = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__bip = e;
    window.dispatchEvent(new Event("bip-ready"));
  });
  window.addEventListener("appinstalled", function () {
    window.__bip = null;
    window.dispatchEvent(new Event("bip-done"));
  });
</script>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
